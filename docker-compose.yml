# ─────────────────────────────────────────────────────────────────────────────
#  Posora – Docker Compose
#
#  DATABASE: Uses your LOCAL PostgreSQL (running on the host machine).
#  The containers reach it via host.docker.internal:5432.
#  No postgres container / no Docker volume for the database.
#
#  Redis: lightweight in-container instance (no persistence needed for dev).
#
#  Usage:
#    docker compose up --build
#
#  Env file:
#    Copy backend/.env and store/.env.local — values are referenced below.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: posora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Medusa Backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: posora-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./backend/static:/app/static
    environment:
      # ── Database: point at LOCAL postgres on the host ──────────────────────
      # host.docker.internal resolves to the host machine on Docker Desktop (Win/Mac).
      DATABASE_URL: ${DATABASE_URL}

      # ── Redis ──────────────────────────────────────────────────────────────
      REDIS_URL: redis://redis:6379
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PORTAL_REGION_ID: ${PORTAL_REGION_ID}
      PORTAL_SALES_CHANNEL_ID: ${PORTAL_SALES_CHANNEL_ID}

      # ── CORS (update domains when deploying) ───────────────────────────────
      STORE_CORS: "http://localhost:3000,http://localhost:3001"
      ADMIN_CORS: "http://localhost:9000,http://localhost:5173"
      AUTH_CORS:  "http://localhost:3000,http://localhost:9000,http://localhost:5173"

      # ── Secrets ───────────────────────────────────────────────────────────
      JWT_SECRET:    supersecret
      COOKIE_SECRET: supersecret

      # Serve the Admin compiled into the image, not transient Vite /@fs chunks.
      NODE_ENV: production
      LOCAL_HTTP_COOKIES: "true"
    # Linux only: uncomment if host.docker.internal doesn't resolve
    # extra_hosts:
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # ── Next.js Store Frontend ────────────────────────────────────────────────────
  store:
    build:
      context: ./store
      dockerfile: Dockerfile
      args:
        # Clerk keys
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        # Backend URL — use the service name inside docker network
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://backend:9000
        # Your publishable API key from Medusa admin
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard
    container_name: posora-store
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      # Runtime secrets (not baked into the build)
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      MEDUSA_API_KEY: ${MEDUSA_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
